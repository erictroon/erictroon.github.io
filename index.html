<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Raspberry Pi</title>
  <!-- Librería para gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 900px;
    }
    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      margin: 0.25rem 0 0 0;
    }
    .btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0284c7;
      color: #ffffff;
    }
    .chart-container {
      position: relative;
      height: 400px;
      width: 100%;
    }
    #error-message {
      color: #ef4444;
      font-weight: bold;
      display: none;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-actions">
      <div>
        <h1 id="titulo-dispositivo">Raspberry Pi - Cargando...</h1>
        <p id="subtitulo-info">Leyendo datos desde datos.json</p>
      </div>
      <button class="btn" onclick="downloadJSON()">Descargar .json</button>
    </div>

    <div id="error-message">Error: No se pudo cargar el archivo datos.json. Asegúrate de servir los archivos a través de un servidor local (por ejemplo, Live Server en VS Code).</div>

    <div class="chart-container">
      <canvas id="piChart"></canvas>
    </div>
  </div>

  <script>
    let datasetGlobal = null;

    // Cargar datos desde el archivo datos.json
    async function cargarDatos() {
      try {
        const response = await fetch('datos.json');
        if (!response.ok) {
          throw new Error('No se pudo encontrar el archivo datos.json');
        }
        const data = await response.json();
        datasetGlobal = data;

        // Actualizar textos del encabezado
        document.getElementById('titulo-dispositivo').textContent = `${data.dispositivo} - ${data.ubicacion}`;
        document.getElementById('subtitulo-info').textContent = `Telemetría del período: ${data.periodo}`;

        // Renderizar gráfico
        renderizarGrafico(data.lecturas);
      } catch (error) {
        console.error('Error al cargar datos:', error);
        document.getElementById('error-message').style.display = 'block';
      }
    }

    function renderizarGrafico(lecturas) {
      const ctx = document.getElementById('piChart').getContext('2d');

      const fechas = lecturas.map(item => item.fecha);
      const temperaturas = lecturas.map(item => item.temperatura_c);
      const cpu = lecturas.map(item => item.cpu_uso_pct);
      const ram = lecturas.map(item => item.ram_uso_pct);

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: fechas,
          datasets: [
            {
              label: 'Temperatura (°C)',
              data: temperaturas,
              borderColor: '#ef4444',
              backgroundColor: 'rgba(239, 68, 68, 0.1)',
              borderWidth: 2,
              tension: 0.3,
              yAxisID: 'yTemp'
            },
            {
              label: 'Uso CPU (%)',
              data: cpu,
              borderColor: '#3b82f6',
              borderWidth: 2,
              borderDash: [5, 5],
              tension: 0.3,
              yAxisID: 'yUsage'
            },
            {
              label: 'Uso RAM (%)',
              data: ram,
              borderColor: '#10b981',
              borderWidth: 2,
              tension: 0.3,
              yAxisID: 'yUsage'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              grid: { color: '#334155' },
              ticks: { color: '#94a3b8' }
            },
            yTemp: {
              type: 'linear',
              position: 'left',
              title: { display: true, text: 'Temperatura (°C)', color: '#ef4444' },
              grid: { color: '#334155' },
              ticks: { color: '#ef4444' }
            },
            yUsage: {
              type: 'linear',
              position: 'right',
              title: { display: true, text: 'Uso (%)', color: '#3b82f6' },
              grid: { drawOnChartArea: false },
              ticks: { color: '#3b82f6' },
              min: 0,
              max: 100
            }
          },
          plugins: {
            legend: {
              labels: { color: '#f8fafc' }
            }
          }
        }
      });
    }

    // Función para descargar el archivo json
    function downloadJSON() {
      if (!datasetGlobal) return;
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(datasetGlobal, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "temperatura.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // Ejecutar carga al abrir la página
    cargarDatos();
  </script>
</body>
</html>
