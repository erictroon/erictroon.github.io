<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temperatura DS18B20</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f3f4f6;--mut:#6b7280;--acc:#e4572e}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--fg:#f3f4f6;--card:#1f2937;--mut:#9ca3af}}
body{font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}.mut{color:var(--mut);font-size:.85rem}
.card{background:var(--card);border-radius:12px;padding:14px;margin:14px 0}
.big{font-size:2.4rem;font-weight:700;color:var(--acc)}
.st{display:flex;gap:18px;flex-wrap:wrap}.st b{display:block;font-size:1.05rem}
canvas{width:100%;height:160px;display:block;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
td,th{text-align:left;padding:3px 6px;border-bottom:1px solid var(--mut)}
</style></head><body>
<h1>🌡️ Temperatura (DS18B20)</h1>
<div class="mut" id="gen">Cargando…</div>
<div id="app"></div>
<script>
const $=id=>document.getElementById(id);
function chart(cv,pts){const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
cv.width=w*d;cv.height=h*d;const c=cv.getContext("2d");c.scale(d,d);
const v=pts.map(p=>p.temperatura_C),mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;
c.strokeStyle="#e4572e";c.lineWidth=2;c.beginPath();
v.forEach((t,i)=>{const x=i/Math.max(v.length-1,1)*(w-8)+4,y=h-6-(t-mn)/r*(h-24);i?c.lineTo(x,y):c.moveTo(x,y)});
c.stroke();c.fillStyle="#888";c.font="11px sans-serif";c.fillText(mx.toFixed(1)+"°",4,11);c.fillText(mn.toFixed(1)+"°",4,h-8)}
async function load(){try{
const j=await (await fetch("temperatura.json?"+Date.now())).json();
$("gen").textContent="Actualizado: "+j.generado.replace("T"," ");
$("app").innerHTML=j.sensores.map((s,i)=>`<div class="card"><div class="mut">${s.sensor}</div>
<div class="big">${s.ultima_lectura.temperatura_C.toFixed(2)} °C</div>
<div class="st"><span>Mín<b>${s.minima}</b></span><span>Máx<b>${s.maxima}</b></span><span>Media<b>${s.media}</b></span><span>Lecturas<b>${s.total_lecturas}</b></span></div>
<canvas id="c${i}"></canvas><table><tr><th>Fecha y hora</th><th>°C</th></tr>
${s.lecturas.slice(-8).reverse().map(l=>`<tr><td>${l.fecha_hora.replace("T"," ")}</td><td>${l.temperatura_C.toFixed(2)}</td></tr>`).join("")}</table>
<p class="mut"><a href="temperatura.csv" style="color:inherit">Descargar CSV</a> · <a href="temperatura.json" style="color:inherit">JSON</a></p></div>`).join("");
j.sensores.forEach((s,i)=>chart($("c"+i),s.lecturas));
}catch(e){$("gen").textContent="Sin datos todavía."}}
load();setInterval(load,60000);
</script></body></html>
